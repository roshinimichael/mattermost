# Added by Skyramp Testbot. Skyramp dispatches it with a run id: to onboard the System Under Test from the
# run's own skyramp/testbot/onboarding-<run id> branch, and Validation Runs from skyramp/testbot/validation-<run id>
# or the branch you merge it to; its last job deletes a run's own branch. Testbot decides what each run does.
name: Skyramp Testbot V3
# A dispatched run is titled with what started it, its Target and its run id. A push run keeps its commit message, and
# a dispatch without a title still names its run id.
run-name: ${{ inputs.skyramp_run_title || github.event.head_commit.message || (inputs.skyramp_run_id && format('Skyramp Testbot · {0}', inputs.skyramp_run_id)) || 'Skyramp Testbot' }}

on:
  # GitHub dispatches only a workflow it knows, so the push of a run's branch registers it. The jobs skip that run.
  push:
    branches: ['skyramp/testbot/onboarding-*', 'skyramp/testbot/validation-*']
  workflow_dispatch:
    inputs:
      skyramp_run_id:
        description: Run id from the Testbot webapp.
        required: true
        type: string
      skyramp_run_title:
        description: Title of the run in GitHub Actions, from the Testbot webapp.
        required: false
        type: string

concurrency:
  group: skyramp-testbot-${{ inputs.skyramp_run_id || github.run_id }}

permissions:
  contents: read
  # The runner signs in to the Testbot webapp with the job's OIDC token.
  id-token: write

jobs:
  testbot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 390
    steps:
      - name: Run Skyramp Testbot
        uses: skyramp/testbot@v1
        with:
          pipeline: staged
          skyrampRunId: ${{ inputs.skyramp_run_id }}
          skyrampAppOrigin: https://testbot-staging.skyramp.dev
          githubToken: ${{ github.token }}
          engineVersion: 'next-v3'
          skyrampMcpVersion: 'next'
          # CI checks Validation Triage may count as existing evidence, when they passed on the commit under test.
          trustedChecks: 'mmctl-printer-unit-tests'

  # A run's own branch carries only that run, so it is deleted once the run ends, however it ends.
  cleanup:
    needs: testbot
    if: always() && github.event_name == 'workflow_dispatch' && (github.ref == format('refs/heads/skyramp/testbot/onboarding-{0}', inputs.skyramp_run_id) || github.ref == format('refs/heads/skyramp/testbot/validation-{0}', inputs.skyramp_run_id))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the onboarding branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"

