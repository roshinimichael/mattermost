# Added by Skyramp Testbot. Skyramp dispatches it with a run id: to onboard the System Under Test from the
# onboarding pull request's branch, and, once merged, for Validation Runs. Testbot itself decides what each run does.
name: Skyramp Testbot V3

on:
  # GitHub dispatches only a workflow it knows, so the push of the onboarding branch registers it. The job skips that run.
  push:
    branches: ['skyramp/testbot/onboarding']
  workflow_dispatch:
    inputs:
      skyramp_run_id:
        description: Run id from the Testbot webapp.
        required: true
        type: string

concurrency:
  group: skyramp-testbot-${{ inputs.skyramp_run_id || github.run_id }}

permissions:
  contents: read
  # The runner signs in to the Testbot webapp with the job's OIDC token.
  id-token: write

jobs:
  testbot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Run Skyramp Testbot
        uses: letsramp/testbot@c3478eec779fc228337c1a7041ca2d2964f0e37a
        env:
          # A credential reference names the environment variable the workflow supplies.
          ANTHROPIC_API_KEY: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
        with:
          pipeline: staged
          skyrampRunId: ${{ inputs.skyramp_run_id }}
          skyrampAppOrigin: https://testbot-staging.skyramp.dev
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          githubToken: ${{ github.token }}

